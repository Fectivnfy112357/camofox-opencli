[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
user=root

[program:camofox]
# Run the Camofox Browser fork directly. Stage 4 installs the fork under
# /opt/camofox/ in the runtime image. The upstream is now jo-inc/camofox-browser,
# which ships a single ESM `server.js` (no TypeScript build needed). The
# previous redf0x1 fork needed `node dist/src/server.js` after `npm run build`.
# Memory cap is still 128 MB to keep the heap predictable on Fly machines.
command=node --max-old-space-size=128 server.js
directory=/opt/camofox
user=node
environment=HOME="/home/node",NODE_ENV="production"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=1

[program:opencli-daemon]
command=node /opt/opencli/dist/src/daemon.js
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=2

[program:shim]
command=node /opt/shim/index.js
user=node
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=3
depends_on=camofox opencli-daemon

[program:gateway]
command=node /opt/gateway/mcp/index.js
user=node
# CAMOFOX_API_KEY/URL/USER_ID are forwarded so the video subsystem can pull
# cookies from /sessions/<userId>/cookies (used by yt-dlp-based downloads).
# Without CAMOFOX_API_KEY the Camofox cookies endpoint returns 403 and every
# non-native download fails (LOGIN_REQUIRED even when the user is logged in).
# The %(ENV_*)s syntax pulls values from the supervisord process's own
# environment, which inherits the values docker-compose.yml injects into the
# container — keeps the secret in one place.
# GATEWAY_LOG_DIR is intentionally not set here: gateway's config.ts default
# is $HOME/.camofox/gateway/log, which lives under the same ./data bind-mount
# as everything else, so no extra volume wiring is needed.
environment=HOME="/home/node",NODE_ENV="production",CAMOFOX_API_KEY="%(ENV_CAMOFOX_API_KEY)s",CAMOFOX_URL="%(ENV_CAMOFOX_URL)s",CAMOFOX_USER_ID="%(ENV_CAMOFOX_USER_ID)s"
autostart=true
autorestart=true
startsecs=5
# supervisord's own stdout/stderr capture for the gateway node process.
# Lands in the same bind-mount as gateway.log, so a single host path
# (`./data/gateway/log/`) holds every gateway-related log file.
stdout_logfile=/home/node/.camofox/gateway/log/supervisor-stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/home/node/.camofox/gateway/log/supervisor-stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
priority=4
depends_on=opencli-daemon
