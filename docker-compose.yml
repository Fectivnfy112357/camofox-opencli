services:
  camofox:
    # Default: pull the pre-built image from GitHub Container Registry.
    # To build locally instead, comment out `image:` and uncomment the
    # `build:` block below.
    image: ghcr.io/fectivnfy112357/camofox-opencli:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   # Two sibling source trees live next to this compose file on the host:
    #   #   ../camofox-browser   (the camofox-browser fork)
    #   #   ../opencli           (the OpenCLI fork)
    #   # We inject them as named build contexts so the Dockerfile can `COPY
    #   # --from=camofox-browser` etc. without any git-submodule wiring.
    #   additional_contexts:
    #     # Sibling source trees live next to this compose file on the host.
    #     # Override via CAMOFOX_BROWSER_DIR / OPENCLI_DIR env vars when the
    #     # siblings happen to live elsewhere.
    #     camofox-browser: ${CAMOFOX_BROWSER_DIR:-./camofox-browser}
    #     opencli:         ${OPENCLI_DIR:-./opencli}
    #   # The Dockerfile sets http_proxy=http://host.docker.internal:7890 so
    #   # build-stage apt/curl/npm go through the host's mihomo. Build
    #   # containers need their own extra_hosts mapping (the one in the
    #   # service block below only applies to the runtime container).
    #   extra_hosts:
    #     - "host.docker.internal:host-gateway"
    container_name: camofox
    restart: unless-stopped

    # extra_hosts is also needed at runtime: the Camofox browser connects
    # back to the host's mihomo at host.docker.internal:7890 for HTTPS
    # traffic, and the gateway's yt-dlp invocation uses the same proxy.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "9377:9377"
      - "6080:6080"
      - "19825:19825"
      - "9378:8080"

    environment:
      # Camofox (upstream is now jo-inc/camofox-browser master — fork
      # is at github.com/Fectivnfy112357/camofox-browser).
      # NOTE: env var names below align with jo-inc lib/config.js.
      # CAMOFOX_HOST (the old redf0x1 name) was renamed upstream to
      # CAMOFOX_BIND_HOST. CAMOFOX_AUTH_MODE / CAMOFOX_VNC_TIMEOUT_MS /
      # CAMOFOX_ALLOW_PRIVATE_NETWORK / CAMOUFOX_INSTALL_DIR are NOT
      # recognized by jo-inc and have been removed.
      CAMOFOX_BIND_HOST: "0.0.0.0"
      CAMOFOX_PORT: "9377"
      CAMOFOX_API_KEY: "my_secret_api_key_123"
      # jo-inc uses CAMOFOX_INTERACTIVE to control the display/VNC mode
      # (off | desktop | novnc | auto). The previous redf0x1 fork had a
      # runtime toggle endpoint and used ENABLE_VNC=1 plus
      # CAMOFOX_VNC_TIMEOUT_MS to gate it; jo-inc ships the noVNC stack
      # at boot when this is "novnc".
      CAMOFOX_INTERACTIVE: "novnc"
      ENABLE_VNC: "1"
      VNC_PASSWORD: "my_vnc_password"
      # vnc-watcher.sh defaults to 127.0.0.1 which makes the noVNC port
      # reachable only from inside the container. Bind to 0.0.0.0 so
      # `docker port ... 6080` maps the host port through to the actual
      # websockify listener.
      VNC_BIND: "0.0.0.0"
      PROXY_HOST: "host.docker.internal"
      PROXY_PORT: "7890"
      # Pin camoufox-js to the pre-baked cache directory. The Dockerfile
      # cb-build stage unzips the Camoufox binary into
      # /home/node/.cache/camoufox/. jo-inc reads the cache path from
      # XDG_CACHE_HOME (or ~/.cache/camoufox by default). Since
      # supervisord already sets HOME=/home/node, the default resolves
      # to /home/node/.cache/camoufox — matching the baked path. We
      # set XDG_CACHE_HOME explicitly to make the contract obvious and
      # immune to changes in supervisord's HOME.
      XDG_CACHE_HOME: "/home/node/.cache"
      # PROXY_HOST/PORT above drives the browser fingerprint-proxy layer.
      # camoufox-js startup also performs an outbound public-IP lookup and
      # an optional UBO XPI fetch; camofox-browser routes those through the
      # upstream proxy by patching the process-global fetch()
      # (lib/proxy-fetch.js), because Node's native fetch ignores the proxy
      # env vars on Node 22 (no NODE_USE_ENV_PROXY support).
      #
      # The env vars below cover the *other* processes of this aggregate
      # container:
      #   - opencli-daemon installs undici's EnvHttpProxyAgent
      #     (OpenCLI src/node-network.ts -> installNodeNetwork()) and reads
      #     proxies only from these vars; without them its Node-side
      #     pipeline fetches (the `page === null` path) and the update check
      #     leave the container direct and get geo-blocked.
      #   - curl / wget / yt-dlp / pip inside the container honour them too.
      # Keep NO_PROXY covering loopback (and the proxy host itself) so the
      # healthcheck and the opencli <-> camofox IPC stay direct.
      #
      # Host mihomo must be reachable at host.docker.internal:7890 for
      # browser launch to succeed — verified 2026-09-13 while migrating
      # from v2raya (socks 20170 / http 20171 / rule-http 20172) to
      # mihomo (mixed-port 7890, redir 7892, tproxy 7893). If camoufox
      # launch fails with "Failed to get a public proxy IP address from
      # any API endpoint", check the mihomo outbound node first — not
      # this file.
      http_proxy: "http://host.docker.internal:7890"
      https_proxy: "http://host.docker.internal:7890"
      HTTP_PROXY: "http://host.docker.internal:7890"
      HTTPS_PROXY: "http://host.docker.internal:7890"
      no_proxy: "localhost,127.0.0.1,::1,host.docker.internal,.debian.org,pypi.org,files.pythonhosted.org,github.com"
      NO_PROXY: "localhost,127.0.0.1,::1,host.docker.internal,.debian.org,pypi.org,files.pythonhosted.org,github.com"
      # Shim
      CAMOFOX_URL: "http://localhost:9377"
      CAMOFOX_USER_ID: "fectivnfy"
      SHIM_PORT: "19825"
      # Give YouTube-style SPA sites room to fully render before we time out
      # the navigation. jo-inc lib/config.js default is 25s; some
      # results pages take 30-45s over the mihomo tunnel.
      NAVIGATE_TIMEOUT_MS: "90000"
      # Gateway
      GATEWAY_PORT: "8080"
      GATEWAY_API_KEY: "change_me_gateway_key"
      OPENCLI_MANIFEST: "/opt/opencli/cli-manifest.json"
      GATEWAY_LOG_LEVEL: "info"
      # GATEWAY_LOG_DIR / GATEWAY_OUTPUT_DIR / GATEWAY_COOKIE_DIR are NOT
      # set here on purpose: the gateway's config.ts defaults now resolve
      # to $HOME/.camofox/gateway/{log,tmp,cookies}/, which all live
      # under the single ./data bind-mount below. Override any of them in
      # .env if you need to point the gateway at a non-default location.

    shm_size: "2gb"
    security_opt:
      - seccomp=unconfined
    volumes:
      # Single host-side root for everything the container persists:
      #   - browser profiles, explicit cookie exports, browser downloads
      #   - gateway JSONL log + supervisor stdout/stderr capture
      #   - yt-dlp video download temp files (TTL 1h)
      #   - per-request Netscape cookie staging
      # A `docker compose build && up -d` rebuilds the image and recreates
      # the container, but ./data survives on the host — login state,
      # logs, and pending downloads all persist.
      - ./data:/home/node/.camofox
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9377/health"]
      interval: 30s
      timeout: 5s
      retries: 3

# Network with IPv6 enabled so camoufox-js's impit (hyper-based) can reach
# the mihomo proxy through the IPv6 address that Docker's embedded DNS
# returns for host.docker.internal. Without IPv6, impit locked onto the
# unreachable IPv6 address and every browser launch failed with
# "Failed to get a public proxy IP address from any API endpoint".
networks:
  camofox-opencli_default:
    name: camofox-opencli_default
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.21.0.0/16
        - subnet: 2001:db8:1964:ee7a::/64
